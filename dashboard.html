<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Point Stats Dashboard</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/dashboard.css" />
  </head>
  <body>
    <div id="app">
      <header class="dash-head">
        <div class="title">
          <h1>Point Ledger</h1>
          <span class="sub">Point Stats · board overview</span>
        </div>
        <div class="head-right">
          <span id="fetched-at" class="clock"></span>
          <button id="refresh" class="btn-ghost">↻ Refresh</button>
        </div>
      </header>

      <nav id="filters" class="filters" aria-label="Time filter"></nav>

      <div id="tabs" class="tabs" role="tablist">
        <button class="tab" data-tab="list" role="tab">By List</button>
        <button class="tab" data-tab="user" role="tab">By User</button>
      </div>

      <div id="truncated" class="warn hidden">
        ⚠ Board is large — stats may not include every card.
      </div>

      <!-- Mutually exclusive states -->
      <section id="state-loading" class="state hidden">Loading ledger…</section>

      <section id="state-auth" class="state hidden">
        <p>Grant board read access to open the stats ledger.</p>
        <button id="authorize" class="btn-primary">Authorize &amp; load</button>
      </section>

      <section id="state-empty" class="state empty-note hidden">
        No cards on this board have point data yet.
      </section>

      <section id="state-error" class="state error hidden">
        <p id="error-msg"></p>
        <button id="retry" class="btn-primary">Retry</button>
      </section>

      <section id="content" class="content hidden">
        <div id="table-host" class="sheet"></div>
        <div id="breakdown" class="breakdown sheet"></div>
      </section>
    </div>
    <script type="module" src="/src/ui/dashboard.ts"></script>
  </body>
</html>
