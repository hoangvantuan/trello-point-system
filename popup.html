<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Point System</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/popup.css" />
  </head>
  <body>
    <div id="app">
      <div id="capacity-banner" class="banner hidden"></div>

      <!-- Bảng cân đối: đã log / mục tiêu -->
      <section class="summary">
        <div class="summary-top">
          <div class="figures">
            <span id="sum-logged" class="fig-logged">0</span>
            <span id="sum-estimate" class="fig-target">/ —</span>
          </div>
          <label class="est-edit" title="Đặt mục tiêu (estimate)">
            <span class="est-label">mục tiêu</span>
            <input id="estimate" type="number" min="0" max="100" step="0.1" placeholder="—" />
          </label>
        </div>
        <div id="progress-bar" class="progress empty"><span></span></div>
        <div id="sum-meta" class="sum-meta muted">Chưa đặt mục tiêu</div>
      </section>

      <div class="cols">
      <!-- Ghi nhanh một mốc point -->
      <section id="log-section" class="log">
        <div class="sec-head">Ghi point</div>
        <div id="quick-points" class="chips"></div>
        <div class="form-grid">
          <label class="fld fld-pt">
            <span>Point</span>
            <input id="log-point" type="number" min="0" max="100" step="0.1" placeholder="0" />
          </label>
          <label class="fld fld-date">
            <span>Ngày</span>
            <input id="log-date" type="date" />
          </label>
          <label class="fld fld-cm">
            <span>Ghi chú</span>
            <input id="log-comment" type="text" placeholder="tùy chọn…" />
          </label>
        </div>
        <div id="log-error" class="error"></div>
        <div class="form-actions">
          <button id="log-save" class="btn-primary">Lưu log</button>
          <button id="log-cancel" class="btn-ghost hidden">Hủy</button>
        </div>
      </section>

      <!-- Lịch sử -->
      <section class="history-sec">
        <div class="sec-head sec-head-row">
          <span>Lịch sử</span>
          <span class="grand"><em>tổng nhóm</em> <span id="grand-total">0</span></span>
        </div>
        <div id="history"></div>
      </section>
      </div>

      <footer class="foot">
        <div id="capacity-bar" class="capbar"><span></span></div>
        <span id="capacity-text" class="captext"></span>
      </footer>
    </div>
    <script type="module" src="/src/ui/popup.ts"></script>
  </body>
</html>
